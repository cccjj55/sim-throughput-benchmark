name: ci
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Harness smoke test (dummy backend, no GPU)
        run: python bench/harness.py --backend dummy --envs 64,256 --steps 50 --repeat 1
